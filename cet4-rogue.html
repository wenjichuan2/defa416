":204,"group":9,"en":"观点：I believe that A is..., but B may not be...","cn":"我认为A……，但B未必……","detail":"I believe research is valuable, but making it compulsory may not be practical.（科研有价值，但强制科研未必可行。）"},{"id":205,"group":9,"en":"对比：While A..., B...","cn":"虽然A……，但B……","detail":"While online learning is convenient, it may reduce face-to-face interaction.（网课虽便利，却可能减少面对面交流。）"},{"id":206,"group":9,"en":"并列：A not only does X but also does Y.","cn":"A不仅……而且……","detail":"Research not only develops practical skills but also fosters curiosity.（科研既培养实践技能，也激发好奇心。）"},{"id":207,"group":9,"en":"手段：By doing A, sb. can do B.","cn":"通过做A，可以做B","detail":"By taking part in research, students can acquire practical skills.（通过参与科研，学生能获得实践技能。）"},{"id":208,"group":9,"en":"结果：主句, making it easier for sb. to do sth.","cn":"……，从而使某人更容易……","detail":"Online courses offer flexibility, making it easier for students to manage their time.（网课提供灵活性，使学生更容易安排时间。）"},{"id":209,"group":9,"en":"结果：主句, thereby doing sth.","cn":"……，从而……","detail":"Public transport reduces car use, thereby lowering carbon emissions.（公共交通减少汽车使用，从而降低碳排放。）"},{"id":210,"group":9,"en":"替代：Rather than doing A, sb. should do B.","cn":"与其做A，不如做B","detail":"Rather than forcing students to join projects, universities should offer flexible opportunities.（与其强制科研，不如提供灵活机会。）"},{"id":211,"group":9,"en":"条件：If ..., ... can...","cn":"如果……，就可以……","detail":"If universities provide adequate resources, more students can participate in research.（如果学校提供充足资源，更多学生就能参与科研。）"},{"id":212,"group":9,"en":"让步：Although ..., ...","cn":"尽管……，但是……（不用再加but）","detail":"Although technology brings convenience, it also creates new challenges.（尽管科技带来便利，它也产生新挑战。）"},{"id":213,"group":9,"en":"原因：Given that ..., ...","cn":"鉴于……，……","detail":"Given that students have different interests, a compulsory requirement may be unsuitable.（鉴于学生兴趣不同，强制要求可能不合适。）"},{"id":214,"group":9,"en":"必要性：It is vital for sb. to do sth.","cn":"对某人来说做某事至关重要","detail":"It is vital for students to develop independent thinking.（培养独立思考能力对学生至关重要。）"},{"id":215,"group":9,"en":"反面风险：Without ..., sb. may...","cn":"没有……，某人可能……","detail":"Without proper guidance, students may struggle to complete their projects.（缺少适当指导，学生可能难以完成项目。）"},{"id":216,"group":10,"en":"Never will sb. do sth.","cn":"某人绝不会……（否定词置首，部分倒装）","detail":"Never will we ignore the importance of education.（我们绝不会忽视教育的重要性。）"},{"id":217,"group":10,"en":"Had it not been for A, sb. would have done B.","cn":"若非A，某人本来会……（与过去事实相反）","detail":"Had it not been for my teacher, I would have given up.（若不是老师，我当初就放弃了。）"},{"id":218,"group":10,"en":"So + adj. + be + 主语 + that...","cn":"如此……以至于……（倒装）","detail":"So important is education that everyone deserves access to it.（教育如此重要，每个人都应有机会接受教育。）"},{"id":219,"group":10,"en":"No sooner had sb. done A than sb. did B.","cn":"刚做完A就做B（than，不能漏主语）","detail":"No sooner had I arrived than the meeting began.（我刚到，会议就开始了。）"},{"id":220,"group":10,"en":"Hardly had sb. done A when sb. did B.","cn":"刚做完A就做B（when）","detail":"Hardly had I sat down when the phone rang.（我刚坐下，电话就响了。）"},{"id":221,"group":10,"en":"Not only can sb. do A, but sb. can also do B.","cn":"不仅能……还能够……（首句倒装，后句有主语）","detail":"Not only can reading broaden our horizons, but it can also improve our thinking skills.（阅读不仅拓宽视野，还能提升思维能力。）"},{"id":222,"group":10,"en":"A is a/an B, one that...","cn":"A是一个B，一个……的B（one 指前面的单数可数名词）","detail":"Education is a lifelong journey, one that never truly ends.（教育是一场终身旅程，一场永不真正结束的旅程。）"},{"id":223,"group":10,"en":"名词 + which + 谓语...","cn":"用 which 补充说明事物","detail":"The university offers free courses, which benefit many students.（大学开设免费课程，许多学生因此受益。）"},{"id":224,"group":10,"en":"Originally built for..., A was later used to...","cn":"A最初为……建造，后来被用于……","detail":"Originally built to transport grain, the canal was later used to carry other goods.（运河最初用于运粮，后来也运输其他商品。）"},{"id":225,"group":10,"en":"主句, reflecting...","cn":"……，反映出……","detail":"Students held a grand ceremony, reflecting the high status of teachers.（学生举行隆重仪式，反映教师地位之高。）"},{"id":226,"group":10,"en":"A continues to be + 过去分词.","cn":"A持续受到……（被动）","detail":"This tradition continues to be upheld today.（这一传统今天仍得到传承。）"},{"id":227,"group":10,"en":"A has played a vital role in B.","cn":"A在B中一直发挥重要作用","detail":"The canal has played a vital role in China's economic development.（运河长期对中国经济发展发挥重要作用。）"},{"id":228,"group":11,"en":"acknowledge","cn":"v. 承认；确认","detail":"acknowledge the problem（承认问题）"},{"id":229,"group":11,"en":"advocate","cn":"v. 提倡；n. 倡导者","detail":"advocate doing sth.（提倡做某事）"},{"id":230,"group":11,"en":"anticipate","cn":"v. 预期；预料","detail":"anticipate difficulties（预料困难）"},{"id":231,"group":11,"en":"appeal","cn":"v./n. 吸引；呼吁；申诉","detail":"appeal to young people（吸引年轻人）"},{"id":232,"group":11,"en":"approach","cn":"v. 接近、处理；n. 方法","detail":"an approach to solving problems"},{"id":233,"group":11,"en":"arise","cn":"v. 出现、产生","detail":"problems arise；arise–arose–arisen"},{"id":234,"group":11,"en":"assert","cn":"v. 断言；主张","detail":"assert that...（断言……）"},{"id":235,"group":11,"en":"attain","cn":"v. 达到、获得","detail":"attain a goal（实现目标）"},{"id":236,"group":11,"en":"cease","cn":"v. 停止","detail":"cease to exist（不复存在）"},{"id":237,"group":11,"en":"clarify","cn":"v. 澄清、阐明","detail":"clarify one's position（阐明立场）"},{"id":238,"group":11,"en":"conclude","cn":"v. 得出结论；结束","detail":"conclude that...；draw a conclusion"},{"id":239,"group":11,"en":"confront","cn":"v. 面对、直面","detail":"confront a challenge（直面挑战）"},{"id":240,"group":11,"en":"constitute","cn":"v. 构成；等同于","detail":"constitute a threat（构成威胁）"},{"id":241,"group":11,"en":"convey","cn":"v. 传达；输送","detail":"convey a message（传递信息）"},{"id":242,"group":11,"en":"derive","cn":"v. 获得；源于","detail":"derive benefits from；derive from"},{"id":243,"group":11,"en":"diminish","cn":"v. 减少；削弱","detail":"diminish the impact（减弱影响）"},{"id":244,"group":11,"en":"disclose","cn":"v. 披露、公开","detail":"disclose information（披露信息）"},{"id":245,"group":11,"en":"emerge","cn":"v. 出现、显现","detail":"emergin ；-ed/-ing 可能作形容词；-s 可能是名词复数或动词三单。"},{"id":3,"name":"阅读常见抽象词｜真题复盘","intro":"A/B 级 · 来自厌恶、冒名、运动、音乐、有机食品及电话面试等阅读；括号标出主要来源。","note":"这些词重在阅读识别；专业词无需全部练写作。优先掌握 maintain、engage、relevant、adequate、substantial。"},{"id":4,"name":"真题短语｜熟词僻义与同义替换","intro":"A 级 · 整理阅读中常见的“单词都认识，组合却不认识”的表达。","note":"复盘原则：记住整体含义，再观察原文和选项的同义替换；不必逐字直译。"},{"id":5,"name":"写作必背｜基本骨架与个人错题","intro":"A 级 · 先确保写对，再追求高级。以下优先解决你作文和汉译英反复出现的搭配错误。","note":"自检：every student（单数）；teachers（泛指复数）；an old saying；it provides（三单）；情态动词 + 原形。"},{"id":6,"name":"高级词汇｜你的高考笔记＋补充","intro":"B 级 · 前18组来自你此前拍摄的手写词汇页（释义与用法已校正）；后面为新增可迁移表达。","note":"高级词的原则：先用熟悉的搭配。unambiguously / unequivocally 用于强调明确立场，不适合反复放句首充当“显然”。"},{"id":7,"name":"四级通用词与主题表达","intro":"B 级 · 根据常见议题补充，并非官方词频排名或押题。优先记能在多个话题中迁移的表达。","note":"写作主题词不是越难越好：教育、科技、环保、健康、就业五类话题，优先用准确而具体的搭配。"},{"id":8,"name":"写作与翻译｜主题搭配库","intro":"A/B 级 · 这些词组比单独背中文释义更适合主动输出。前半通用写作，后半文化翻译。","note":"复习时做中文→英文：每组记一条最自然的表达；写作文优先用本页和第05页的搭配。"},{"id":9,"name":"高级句式｜作文直接套用","intro":"A 级 · 每个句式都附完整例句与中文。换话题时只替换内容，不改变语法骨架。","note":"推荐先熟练使用第2、4、5、7、10句型。不要每段都强行用复杂句；一篇作文选2—3个即可。"},{"id":10,"name":"高级句式｜原笔记校正与文化翻译","intro":"B 级 · 前5组为高考手写笔记中的倒装／虚拟结构；其余是作文和翻译新增的实用结构。","note":"倒装与虚拟语气不是高分必需项。尤其 No sooner / Hardly 多用于叙事，议论文不必硬套。\n考前训练：每天任选3组表达，闭卷写3句；隔天重写。不要只抄范文。"},{"id":11,"name":"通用核心｜阅读高价值动词","intro":"A 级 · 新增通用词库：优先熟悉动词含义、宾语及介词；不限定于已做过的试卷。","note":"识别优先：看到动词能快速说出语境含义；尤其注意 arise 不及物，constitute 和 imply 后的结构。"},{"id":12,"name":"通用核心｜动词与词形变化","intro":"A 级 · Section A 的动词、过去分词、派生名词与阅读常见搭配。","note":"词形不能死板：-tion/-ment 常见于名词，-ed/-ing 也可能作修饰成分；先看空格所需功能。"},{"id":13,"name":"通用核心｜形容词与副词","intro":"A 级 · 常用于描述研究、社会现象、程度及态度；尤其适合 Section A。","note":"注意程度差别：considerable 不等于全部；potential 不等于已经发生；apparently 不保证事实成立。"},{"id":14,"name":"通用核心｜抽象名词与论证词","intro":"A 级 · 阅读常见概念、研究术语和社会议题；重点学会区分相近名词。","note":"阅读抓住：evidence 是证据，implication 是潜在影响，consequence 是后果；不要把推断当作已证实事实。"},{"id":15,"name":"熟词僻义｜认识单词也容易丢分","intro":"A 级 · 用不同语境唤醒第二、第三义；特别适合长篇匹配与仔细阅读。","note":"这些词先做英译中识别；看到具体宾语再决定含义，例如 cover a topic 与 cover the cost 译法不同。"},{"id":16,"name":"高频型短语｜动词＋介词／副词","intro":"A 级 · 阅读和听力优先。短语整体记忆，不能靠逐词翻译。","note":"注意因果方向：A results in B = A 导致 B；A results from B = A 源于 B。"},{"id":17,"name":"阅读辨析｜逻辑信号与选项替换","intro":"A 级 · 针对“文章读懂了但选错”的情况。表达对应是语境近义，不代表任何情况下都能互换。","note":"做题检查：对象、因果方向、时间范围、程度和否定。原文可能只说 may，选项却写 must。"},{"id":18,"name":"易混词｜形近词与语法辨析","intro":"A 级 · 对照记忆，尤其用于选词填空、作文与翻译。","note":"写作不必追求生僻词；先避免形近词误用、拼写错误及词性错误。"},{"id":19,"name":"通用主题｜教育、科技、社会与健康","intro":"B 级 · 补充常见阅读和作文语境；记词时一并记自然搭配。","note":"写作优先学可迁移的搭配；专业主题词以阅读识别为主。"},{"id":20,"name":"通用主题｜听力新闻与校园场景","intro":"B 级 · 常见新闻、采访、通知、招聘与校园生活词。目标是扫选项时快速定位。","note":"预读听力时先抓人、动作、原因、数字和不同选项的关键词；遇到熟词僻义按语境理解。"},{"id":21,"name":"作文增色｜可迁移的论证搭配","intro":"A/B 级 · 记住搭配而非孤立难词；先掌握前半部分，再练后半部分。","note":"写作练习：每次闭卷写3句，将本页搭配与第09–10页句式结合。准确、具体，比强行使用生僻词更重要。\n来源说明：01–10页保留原手册（个人真题、手写笔记与精选表达）；11–21页为新增通用备考词汇、短语及辨析，按常见四级语境人工精选，未做全量真题词频统计，非官方高频排名或押题。"}];

f.mode;$('#scope').onchange=e=>{store.pref.scope=e.target.value;save()};$('#mode').onchange=e=>{store.pref.mode=e.target.value;save()}}
function newRun(){const scope=$('#scope').value,mode=$('#mode').value;if(!pool(scope).length){flash('还没有待复习错词，先开启普通挑战');return}if(r&&r.phase!=='end'&&!confirm('开始新一局？当前冒险将结束，单词记录仍保留。'))return;store.pref={scope,mode};store.runs++;r={scope,mode,scopeIds:pool(scope).map(x=>x.id),floor:1,hp:62,maxHp:62,relics:[],phase:'path',enemy:null,seen:[],miss:[],pending:[],turn:0,correct:0,wrong:0,combo:0,bestCombo:0,cleared:0,runXP:0,skill:'strike',focus:1,feedback:null,history:[],asked:[],path:null};screen='run';newPath();save();render()}
function newPath(){r.phase='path';r.feedback=null;r.path=r.floor===1?['normal']:r.floor===7?['boss']:r.floor%2===0?['normal','elite']:['normal','rest'];}
function path(){const meta={normal:['⚔','普通战斗','难度适中 · 胜利后选择遗物'],elite:['◆','精英战斗','更强守卫 · 可从 3 件遗物中选择，额外经验'],rest:['✚','篝火营地','恢复 20 点生命 · 不需要答题'],boss:['♛','最终 Boss','遗忘之王 · 最后一战']};app.innerHTML=`<section class="panel"><div class="row between"><div><span class="eyebrow">ASCENT / FLOOR ${r.floor}</span><h2>选择下一站</h2></div><strong class="teal">♥ ${r.hp}/${r.maxHp}</strong></div>${track()}<div class="map">${Array.from({length:7},(_,j)=>7-j).map((n,i)=>`<div class="mapline"><span class="dot ${n<r.floor?'done':n===r.floor?'current':''}">${n===7?'♛':n<r.floor?'✓':n}</span></div>${i<6?'<div class="connector"></div>':''}`).join('')}</div><div class="pathgrid" style="grid-template-columns:repeat(${r.path.length},minmax(0,1fr))">${r.path.map(k=>`<button class="node" data-a="node" data-v="${k}"><span class="symbol">${meta[k][0]}</span><b>${meta[k][1]}</b><small>${meta[k][2]}</small></button>`).join('')}</div><p class="muted">本局答对 ${r.correct} · 答错 ${r.wrong} · 连击最高 ${r.bestCombo}</p>${relicsHTML()}</section>`}
function relicsHTML(){return r.relics.length?`<div class="relicline">${r.relics.map(id=>{let x=RELICS.find(y=>y.id===id);return `<span class="chip" title="${esc(x.desc)}">${x.icon} ${x.name}</span>`}).join('')}</div>`:''}
function enter(type){if(r.phase!=='path'||!r.path.includes(type))return;if(type==='rest'){let gain=Math.min(20,r.maxHp-r.hp);r.hp+=gain;r.phase='rest';r.restGain=gain;r.history.push({floor:r.floor,type:'rest'});save();render();return}const a=pick(ENEMIES[type]);let hp=a[2]+(type==='boss'?0:Math.max(0,r.floor-1)*2);r.enemy={type,name:a[0],subtitle:a[1],hp,maxHp:hp,attack:a[3]+(r.floor>=5&&type!=='boss'?1:0),turn:0};r.phase='battle';r.focus=relic('focus')?2:1;r.skill='strike';r.feedback=null;r.question=null;nextQuestion();save();render()}
function nextQuestion(){const p=r.scopeIds?r.scopeIds.map(id=>byId[id]).filter(Boolean):pool(r.scope);let allowed=p.length?p:DATA;const due=r.pending.find(x=>x.due<=r.turn&&byId[x.id]);let w;if(due){w=byId[due.id];r.pending=r.pending.filter(x=>x.id!==due.id)}else{const fresh=allowed.filter(x=>!r.seen.includes(x.id));if(fresh.length){let weak=fresh.filter(x=>store.master[x.id]?.wrong>0&&(store.master[x.id]?.streak||0)<2);let unseen=fresh.filter(x=>!store.master[x.id]||!store.master[x.id].seen);w=pick(weak.length&&Math.random()<.6?weak:unseen.length&&Math.random()<.8?unseen:fresh)}else{w=pick(allowed.filter(x=>x.id!==r.asked.at(-1)) .length?allowed.filter(x=>x.id!==r.asked.at(-1)):allowed)}}r.seen.push(w.id);r.asked.push(w.id);let dir=r.mode==='mixed'?(r.enemy.type==='boss'&&Math.random()<.7?'cn':Math.random()<.65?'en':'cn'):r.mode;let field=dir==='en'?'cn':'en';let options=[];if(dir!=='recall'){let others=shuffle(allowed.filter(x=>x.id!==w.id&&x[field]!==w[field]));let all=shuffle(DATA.filter(x=>x.id!==w.id&&x[field]!==w[field]));const used=new Set([w[field]]);for(let x of [...others,...all]){if(!used.has(x[field])){used.add(x[field]);options.push(x.id)}if(options.length===3)break}options=shuffle([w.id,...options])}r.question={id:w.id,dir,options,repeat:!!due,reveal:false,typed:''};r.feedback=null;r.skill='strike'}
function intent(){let t=r.enemy.turn%3;return t===1?0:t===2?r.enemy.attack+2:r.enemy.attack}function damageVal(k){let base=k==='strike'?14:k==='guard'?8:10;return base+(relic('blade')?3:0)}function battle(){const q=r.question,w=byId[q.id],e=r.enemy,f=r.feedback,damage=intent();app.innerHTML=`<section class="panel" style="margin-top:0"><div class="row between"><span class="eyebrow">第 ${r.floor} / 7 层 · ${e.type==='boss'?'Boss':e.type==='elite'?'精英':'普通'}</span><span class="gold">✷ 连击 ${r.combo}</span></div>${track()}<div class="meters">${meter(r.hp,r.maxHp)}${meter(e.hp,e.maxHp,true)}</div><div class="arena"><div class="fighter">${PLAYER}<strong>词汇旅人</strong></div><span class="vs">vs.</span><div class="fighter ${f?.ok?'hit':''}">${enemyArt(e.type)}<strong>${esc(e.name)}</strong><span class="intent">${f?'本回合结束':damage?'意图：攻击 '+damage:'意图：蓄力（0伤害）'}</span></div></div>${relicsHTML()}</section><section class="panel"><div class="row between"><h3>选择卡牌</h3><span class="muted">答对才释放技能</span></div><div class="cardrow">${[['strike','⚔','斩击',`${damageVal('strike')} 伤害`],['guard','⬡','格挡',`${damageVal('guard')} 伤害 · ${8+(relic('shield')?4:0)} 格挡`],['focus','☼','专注',`${damageVal('focus')} 伤害 · 回复 5 HP`]].map(([k,i,n,d])=>`<button class="skill ${r.skill===k?'on':''}" data-a="skill" data-v="${k}" ${f||q.reveal||k==='focus'&&r.focus<=0?'disabled':''}><b><span class="sig">${i}</span>${n}</b><small>${d}${k==='focus'?` · 余 ${r.focus} 次`:''}</small></button>`).join('')}</div><div class="question"><div class="row between"><span class="eyebrow">${q.dir==='en'?'英译中':q.dir==='cn'?'中译英':'闭卷默写'}</span><span class="muted">${q.repeat?'错词回访 · ':''}${esc(GROUPS.find(x=>x.id===w.group)?.name||'')}</span></div><div class="word">${esc(q.dir==='en'?w.en:w.cn)}</div>${q.dir==='recall'?recallHTML(q,w,f):`<div class="opts">${q.options.map((id,i)=>`<button class="opt ${f&&id===w.id?'correct':f&&!f.ok&&id===f.chosen?'wrong':''}" data-a="answer" data-v="${id}" ${f?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${esc(byId[id][q.dir==='en'?'cn':'en'])}</span></button>`).join('')}</div>`}${f?`<div class="feedback ${f.ok?'':'bad'}" role="status"><strong class="${f.ok?'teal':'red'}">${f.ok?`命中！造成 ${f.hit} 点伤害`:'未命中 · 已收录错词'}${f.ok&&r.combo>=3?' · '+r.combo+' 连击':''}</strong><p><b>${esc(w.en)}</b> — ${esc(w.cn)}</p><p class="small">${esc(w.detail)}</p><p class="muted">${f.incoming?`受到 ${f.incoming} 点伤害 · `:'未受到伤害 · '}${f.ok?`+${f.xp} 经验${f.healed?' · 恢复 '+f.healed+' HP':''}`:'隔几题再考一次'}</p></div><button class="primary wide" data-a="next">${e.hp<=0?'战斗胜利 · 领取奖励':r.hp<=0?'查看本局成果':'下一回合'} →</button>`:''}</div></section>`;let ta=$('#typed');if(ta)ta.oninput=e=>{q.typed=e.target.value;save()}}
function recallHTML(q,w,f){return `<textarea id="typed" rows="2" placeholder="先写出你记得的英文，再揭晓答案" ${q.reveal||f?'disabled':''}>${esc(q.typed||'')}</textarea>${!q.reveal&&!f?'<button class="wide" data-a="reveal" style="margin-top:8px">揭晓答案</button>':''}${q.reveal&&!f?`<div class="feedback"><b>${esc(w.en)}</b><p>${esc(w.detail)}</p><p class="muted">允许同义表达；按实际回忆情况自评。</p></div><div class="row"><button style="flex:1" data-a="self" data-v="0">没记住 / 不确定</button><button class="primary" style="flex:1" data-a="self" data-v="1">准确回忆</button></div>`:''}`}
function answer(ok,chosen){if(r.phase!=='battle'||r.feedback)return;const q=r.question,w=byId[q.id];let m=store.master[w.id]||{seen:0,correct:0,wrong:0,streak:0};m.seen++;let hit=0,block=0,heal=0,xp=0;let attack=intent(),before=r.hp;const wasWrong=r.miss.includes(w.id);if(ok){r.correct++;r.combo++;r.bestCombo=Math.max(r.combo,r.bestCombo);m.correct++;m.streak++;hit=damageVal(r.skill)+(relic('combo')&&r.combo>=3?5:0)+(relic('echo')&&wasWrong?5:0);if(r.skill==='guard')block=8+(relic('shield')?4:0);if(r.skill==='focus'){heal+=5;r.focus--}if(relic('heart'))heal+=2;xp=(m.streak===2?8:3)+(r.combo%3===0?2:0);store.xp+=xp;r.runXP+=xp;r.enemy.hp=Math.max(0,r.enemy.hp-hit)}else{r.wrong++;r.combo=0;m.wrong++;m.streak=0;if(!wasWrong)r.miss.push(w.id);r.pending=r.pending.filter(x=>x.id!==w.id);r.pending.push({id:w.id,due:r.turn+3});attack+=2}store.master[w.id]=m;r.hp=Math.min(r.maxHp,r.hp+heal);let healed=r.hp-before;let incoming=r.enemy.hp<=0?0:Math.max(0,attack-block-(relic('armor')?2:0));r.hp=Math.max(0,r.hp-incoming);r.feedback={ok,chosen,hit,incoming,xp,healed};r.turn++;r.enemy.turn++;save();render()}
function rewards(){let e=r.enemy,bonus=e.type==='elite'?12:6;store.xp+=bonus;r.runXP+=bonus;r.cleared++;store.best=Math.max(store.best,r.floor);r.history.push({floor:r.floor,type:e.type});if(r.floor===7){finish(true);return}r.phase='reward';let remaining=RELICS.filter(x=>!relic(x.id));r.reward=shuffle(remaining).slice(0,e.type==='elite'?3:2).map(x=>x.id);r.reward.push('heal');save();render()}
function rewardScreen(){app.innerHTML=`<section class="panel hero"><span class="eyebrow">VICTORY</span><h1>守卫击破</h1><p>每一次正确回忆，都在削弱遗忘。</p>${TOWER}</section><section class="panel"><div class="row between"><h2>选择一项战利品</h2><b class="teal">♥ ${r.hp}/${r.maxHp}</b></div><div class="rewardgrid">${r.reward.map(id=>{let x=id==='heal'?{icon:'✚',name:'恢复药水',desc:'恢复 14 点生命，不获得遗物。'}:RELICS.find(y=>y.id===id);return `<button class="reward" data-a="reward" data-v="${id}"><span class="symbol">${x.icon}</span><b>${esc(x.name)}</b><small>${esc(x.desc)}</small></button>`}).join('')}</div><p class="muted">遗物在本局持续生效，战斗越往后，搭配越重要。</p></section>`}
function advance(){r.floor++;newPath();save();render()}function finish(win){r.phase='end';r.win=win;if(win){store.wins++;store.xp+=25;r.runXP+=25}store.best=Math.max(store.best,win?7:r.floor-1);save();render()}
function endScreen(){app.innerHTML=`<section class="panel hero"><span class="eyebrow">${r.win?'ASCENT COMPLETE':'EXPEDITION ENDED'}</span><h1>${r.win?'登顶成功':'冒险结束'}</h1><p>${r.win?'遗忘之王已倒下。':'这局的生命用尽，但学到的单词仍然保留。'}</p>${TOWER}</section><div class="stats"><div class="stat"><small>本局经验</small><strong class="gold">+${r.runXP}</strong></div><div class="stat"><small>答题正确率</small><strong class="teal">${r.correct+r.wrong?Math.round(r.correct/(r.correct+r.wrong)*100):0}%</strong></div><div class="stat"><small>最高连击</small><strong>${r.bestCombo}</strong></div></div><section class="panel"><h2>本局学习成果</h2><p class="muted">答对 ${r.correct} 次 · 答错 ${r.wrong} 次 · 接触 ${new Set(r.asked).size} 组词汇</p><div class="spacer"></div>${r.miss.length?`<h3>本局错词 ${r.miss.length} 组</h3>${r.miss.map(id=>item(byId[id])).join('')}`:'<p class="teal">本局没有错词。</p>'}<button class="primary wide" data-a="home" style="margin-top:14px">返回营地</button><button class="wide subtle" data-a="book" style="margin-top:8px">打开错词本</button></section>`}
function item(w){return `<div class="reviewitem"><b>${esc(w.en)}</b><p>${esc(w.cn)}</p><p class="muted">${esc(w.detail)}</p><span class="muted">${esc(GROUPS.find(x=>x.id===w.group)?.name||'')} · 答对 ${store.master[w.id]?.correct||0} / 答错 ${store.master[w.id]?.wrong||0}</span></div>`}
function book(){screen='book';app.innerHTML=`<section class="panel"><div class="row between"><h2>冒险词库</h2><button data-a="home">返回</button></div><div class="field"><label for="bookFilter">筛选</label><select id="bookFilter"><option value="wrong">待复习错词（连续两次答对前）</option><option value="all">全部 513 条</option><option value="learned">连续两次答对的词</option>${GROUPS.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select></div><input id="search" type="search" placeholder="搜索英文、中文、例句" style="width:100%;padding:10px;background:#181a24;color:var(--ink);border:1px solid var(--line);border-radius:10px" value="${esc(query)}"><div id="results"></div></section>`;$('#bookFilter').value=bookFilter;$('#bookFilter').onchange=e=>{bookFilter=e.target.value;bookResults()};$('#search').oninput=e=>{query=e.target.value;bookResults()};bookResults()}
function bookResults(){let p=bookFilter==='learned'?DATA.filter(x=>store.master[x.id]?.streak>=2):pool(bookFilter);let q=query.toLowerCase().trim();if(q)p=p.filter(x=>`${x.en} ${x.cn} ${x.detail}`.toLowerCase().includes(q));$('#results').innerHTML=`<p class="muted" style="margin:10px 0">${p.length} 条</p>${p.length?p.map(item).join(''):'<p class="muted">暂无符合条件的词条。</p>'}`}
function render(){if(screen==='home')return home();if(screen==='book')return book();if(!r)return home();if(r.phase==='path')path();else if(r.phase==='battle')battle();else if(r.phase==='reward')rewardScreen();else if(r.phase==='rest')app.innerHTML=`<section class="panel"><span class="eyebrow">REST SITE</span><h2>篝火营地</h2><p class="bigresult">+${r.restGain} HP</p><p class="muted">休整完毕，继续向上。</p><button class="primary wide" style="margin-top:16px" data-a="advance">前往下一层 →</button></section>`;else if(r.phase==='end')endScreen()}
$('#homeBtn').onclick=()=>{save();home()};$('#bookBtn').onclick=()=>{bookFilter='wrong';query='';book()};app.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,v=b.dataset.v;if(a==='start')newRun();else if(a==='resume'){screen='run';render()}else if(a==='home')home();else if(a==='book'){bookFilter='wrong';query='';book()}else if(a==='node')enter(v);else if(a==='skill'&&r.phase==='battle'&&!r.feedback&&!r.question.reveal){if(v==='focus'&&r.focus<=0)return;r.skill=v;save();render()}else if(a==='answer'&&r.phase==='battle'&&!r.feedback)answer(+v===r.question.id,+v);else if(a==='reveal'&&r.phase==='battle'&&!r.feedback){r.question.reveal=true;save();render()}else if(a==='self'&&r.phase==='battle'&&r.question.reveal&&!r.feedback)answer(v==='1',null);else if(a==='next'&&r.phase==='battle'&&r.feedback){if(r.hp<=0)finish(false);else if(r.enemy.hp<=0)rewards();else{nextQuestion();save();render()}}else if(a==='reward'&&r.phase==='reward'&&r.reward.includes(v)){if(v==='heal')r.hp=Math.min(r.maxHp,r.hp+14);else{r.relics.push(v);if(v==='vigor'){r.maxHp+=12;r.hp=Math.min(r.maxHp,r.hp+12)}}advance()}else if(a==='advance'&&r.phase==='rest')advance()});document.addEventListener('keydown',ev=>{if(screen!=='run'||r?.phase!=='battle'||['INPUT','TEXTAREA','SELECT'].includes(ev.target.tagName)||ev.ctrlKey||ev.metaKey)return;let k='abcd'.indexOf(ev.key.toLowerCase());if(k>=0&&!r.feedback&&r.question.dir!=='recall'){let id=r.question.options[k];if(id)answer(id===r.question.id,id)}});render();
</script></body></html>

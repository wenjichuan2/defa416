":"upgrade library facilities"},{"id":186,"group":8,"en":"reduce academic pressure","cn":"减轻学业压力","detail":"alleviate academic pressure"},{"id":187,"group":8,"en":"strike a balance between","cn":"在……之间取得平衡","detail":"balance study and leisure"},{"id":188,"group":8,"en":"raise public awareness of","cn":"提高公众对……的认识","detail":"raise public awareness of environmental protection"},{"id":189,"group":8,"en":"reduce carbon emissions","cn":"减少碳排放","detail":"protect the environment"},{"id":190,"group":8,"en":"make informed decisions","cn":"作出知情、理性的决定","detail":"evaluate information before deciding"},{"id":191,"group":8,"en":"develop healthy habits","cn":"培养健康习惯","detail":"maintain a healthy lifestyle"},{"id":192,"group":8,"en":"impart / pass on knowledge","cn":"传授知识","detail":"Teachers impart knowledge."},{"id":193,"group":8,"en":"conduct oneself","cn":"为人处世、举止得当","detail":"teach students how to conduct themselves"},{"id":194,"group":8,"en":"hold a grand ceremony","cn":"举行隆重的仪式","detail":"hold–held–held"},{"id":195,"group":8,"en":"carry forward a fine tradition","cn":"弘扬优良传统","detail":"carry forward traditional culture"},{"id":196,"group":8,"en":"traditional virtue","cn":"传统美德","detail":"a traditional Chinese virtue"},{"id":197,"group":8,"en":"designate A as B","cn":"将A定为B","detail":"designate September 10 as Teachers' Day"},{"id":198,"group":8,"en":"date back to","cn":"追溯到","detail":"The tradition dates back to ancient times."},{"id":199,"group":8,"en":"be regarded as","cn":"被视为、被认为是","detail":"be regarded as a symbol of culture"},{"id":200,"group":8,"en":"stretch from A to B","cn":"从A延伸至B","detail":"stretch from Beijing to Hangzhou"},{"id":201,"group":8,"en":"facilitate cultural exchanges","cn":"促进文化交流","detail":"promote mutual understanding"},{"id":202,"group":8,"en":"lifelong / continuing education","cn":"终身教育／继续教育","detail":"develop continuing education"},{"id":203,"group":8,"en":"play a leading role in","cn":"在……中发挥主导作用","detail":"play a leading role in education"},{"id":204,"group":9,"en":"观点：I believe that A is..., but B may not be...","cn":"我认为A……，但B未必……","detail":"I believe research is valuable, but making it compulsory may not be practical.（科研有价值，但强制科研未必可行。）"},{"id":205,"group":9,"en":"对比：While A..., B...","cn":"虽然A……，但B……","detail":"While online learning is convenient, it may reduce face-to-face interaction.（网课虽便利，却可能减少面对面交流。）"},{"id":206,"group":9,"en":"并列：A not only does X but also does Y.","cn":"A不仅……而且……","detail":"Research not only develops practical skills but also fosters curiosity.（科研既培养实践技能，也激发好奇心。）"},{"id":207,"group":9,"en":"手段：By doing A, sb. can do B.","cn":"通过做A，可以做B","detail":"By taking part in research, students can acquire practical skills.（通过参与科研，学生能获得实践技能。）"},{"id":208,"group":9,"en":"结果：主句, making it easier for sb. to do sth.","cn":"……，从而使某人更容易……","detail":"Online courses offer flexibility, making it easier for students to manage their time.（网课提供灵活性，使学生更容易安排时间。）"},{"id":209,"group":9,"en":"结果：主句, thereby doing sth.","cn":"……，从而……","detail":"Public transport reduces car use, thereby lowering carbon emissions.（公共交通减少汽车使用，从而降低碳排放。）"},{"id":210,"group":9,"en":"替代：Rather than doing A, sb. should do B.","cn":"与其做A，不如做B","detail":"Rather than forcing students to join projects, universities should offer flexible opportunities.（与其强制科研，不如提供灵活机会。）"},{"id":211,"group":9,"en":"条件：If ..., ... can...","cn":"如果……，就可以……","detail":"If universities provide adequate resources, more students can participate in research.（如果学校提供充足资源，更多学生就能参与科研。）"},{"id":212,"group":9,"en":"让步：Although ..., ...","cn":"尽管……，但是……（不用再加but）","detail":"Although technology brings convenience, it also creates new challenges.（尽管科技带来便利，它也产生新挑战。）"},{"id":213,"group":9,"en":"原因：Given that ..., ...","cn":"鉴于……，……","detail":"Given that students have different interests, a compulsory requirement may be unsuitable.（鉴于学生兴趣不同，强制要求可能不合适。）"},{"id":214,"group":9,"en":"必要性：It is vital for sb. to do sth.","cn":"对某人来说做某事至关重要","detail":"It is vital for students to deve 词；-ed/-ing 可能作形容词；-s 可能是名词复数或动词三单。"},{"id":3,"name":"阅读常见抽象词｜真题复盘","intro":"A/B 级 · 来自厌恶、冒名、运动、音乐、有机食品及电话面试等阅读；括号标出主要来源。","note":"这些词重在阅读识别；专业词无需全部练写作。优先掌握 maintain、engage、relevant、adequate、substantial。"},{"id":4,"name":"真题短语｜熟词僻义与同义替换","intro":"A 级 · 整理阅读中常见的“单词都认识，组合却不认识”的表达。","note":"复盘原则：记住整体含义，再观察原文和选项的同义替换；不必逐字直译。"},{"id":5,"name":"写作必背｜基本骨架与个人错题","intro":"A 级 · 先确保写对，再追求高级。以下优先解决你作文和汉译英反复出现的搭配错误。","note":"自检：every student（单数）；teachers（泛指复数）；an old saying；it provides（三单）；情态动词 + 原形。"},{"id":6,"name":"高级词汇｜你的高考笔记＋补充","intro":"B 级 · 前18组来自你此前拍摄的手写词汇页（释义与用法已校正）；后面为新增可迁移表达。","note":"高级词的原则：先用熟悉的搭配。unambiguously / unequivocally 用于强调明确立场，不适合反复放句首充当“显然”。"},{"id":7,"name":"四级通用词与主题表达","intro":"B 级 · 根据常见议题补充，并非官方词频排名或押题。优先记能在多个话题中迁移的表达。","note":"写作主题词不是越难越好：教育、科技、环保、健康、就业五类话题，优先用准确而具体的搭配。"},{"id":8,"name":"写作与翻译｜主题搭配库","intro":"A/B 级 · 这些词组比单独背中文释义更适合主动输出。前半通用写作，后半文化翻译。","note":"复习时做中文→英文：每组记一条最自然的表达；写作文优先用本页和第05页的搭配。"},{"id":9,"name":"高级句式｜作文直接套用","intro":"A 级 · 每个句式都附完整例句与中文。换话题时只替换内容，不改变语法骨架。","note":"推荐先熟练使用第2、4、5、7、10句型。不要每段都强行用复杂句；一篇作文选2—3个即可。"},{"id":10,"name":"高级句式｜原笔记校正与文化翻译","intro":"B 级 · 前5组为高考手写笔记中的倒装／虚拟结构；其余是作文和翻译新增的实用结构。","note":"倒装与虚拟语气不是高分必需项。尤其 No sooner / Hardly 多用于叙事，议论文不必硬套。\n考前训练：每天任选3组表达，闭卷写3句；隔天重写。不要只抄范文。"},{"id":11,"name":"通用核心｜阅读高价值动词","intro":"A 级 · 新增通用词库：优先熟悉动词含义、宾语及介词；不限定于已做过的试卷。","note":"识别优先：看到动词能快速说出语境含义；尤其注意 arise 不及物，constitute 和 imply 后的结构。"},{"id":12,"name":"通用核心｜动词与词形变化","intro":"A 级 · Section A 的动词、过去分词、派生名词与阅读常见搭配。","note":"词形不能死板：-tion/-ment 常见于名词，-ed/-ing 也可能作修饰成分；先看空格所需功能。"},{"id":13,"name":"通用核心｜形容词与副词","intro":"A 级 · 常用于描述研究、社会现象、程度及态度；尤其适合 Section A。","note":"注意程度差别：considerable 不等于全部；potential 不等于已经发生；apparently 不保证事实成立。"},{"id":14,"name":"通用核心｜抽象名词与论证词","intro":"A 级 · 阅读常见概念、研究术语和社会议题；重点学会区分相近名词。","note":"阅读抓住：evidence 是证据，implication 是潜在影响，consequence 是后果；不要把推断当作已证实事实。"},{"id":15,"name":"熟词僻义｜认识单词也容易丢分","intro":"A 级 · 用不同语境唤醒第二、第三义；特别适合长篇匹配与仔细阅读。","note":"这些词先做英译中识别；看到具体宾语再决定含义，例如 cover a topic 与 cover the cost 译法不同。"},{"id":16,"name":"高频型短语｜动词＋介词／副词","intro":"A 级 · 阅读和听力优先。短语整体记忆，不能靠逐词翻译。","note":"注意因果方向：A results in B = A 导致 B；A results from B = A 源于 B。"},{"id":17,"name":"阅读辨析｜逻辑信号与选项替换","intro":"A 级 · 针对“文章读懂了但选错”的情况。表达对应是语境近义，不代表任何情况下都能互换。","note":"做题检查：对象、因果方向、时间范围、程度和否定。原文可能只说 may，选项却写 must。"},{"id":18,"name":"易混词｜形近词与语法辨析","intro":"A 级 · 对照记忆，尤其用于选词填空、作文与翻译。","note":"写作不必追求生僻词；先避免形近词误用、拼写错误及词性错误。"},{"id":19,"name":"通用主题｜教育、科技、社会与健康","intro":"B 级 · 补充常见阅读和作文语境；记词时一并记自然搭配。","note":"写作优先学可迁移的搭配；专业主题词以阅读识别为主。"},{"id":20,"name":"通用主题｜听力新闻与校园场景","intro":"B 级 · 常见新闻、采访、通知、招聘与校园生活词。目标是扫选项时快速定位。","note":"预读听力时先抓人、动作、原因、数字和不同选项的关键词；遇到熟词僻义按语境理解。"},{"id":21,"name":"作文增色｜可迁移的论证搭配","intro":"A/B 级 · 记住搭配而非孤立难词；先掌握前半部分，再练后半部分。","note":"写作练习：每次闭卷写3句，将本页搭配与第09–10页句式结合。准确、具体，比强行使用生僻词更重要。\n来源说明：01–10页保留原手册（个人真题、手写笔记与精选表达）；11–21页为新增通用备考词汇、短语及辨析，按常见四级语境人工精选，未做全量真题词频统计，非官方高频排名或押题。"}]; const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const DAY=86400000,KEY='cet4-513-v1';let store={},tab='study',queue=[],pos=0,revealed=false,selected=null,options=[],random=true,session={right:0,total:0},search='',reviewFilter='due';try{store=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){};if(typeof store!=='object'||Array.isArray(store))store={};const status=id=>store[id]||{};function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){$('storageNote').textContent='浏览器禁止本地存储，关闭页面后进度可能丢失。'}}function due(c){return !!status(c.id).seen&&(status(c.id).due||0)<=Date.now()}function star(c){return !!status(c.id).star}function stats(){let learned=DATA.filter(c=>status(c.id).seen).length,mastered=DATA.filter(c=>status(c.id).level>=3).length,review=DATA.filter(due).length;$('stats').innerHTML=`<div class="stat"><b>${learned}</b><span>已学习 / ${DATA.length}</span></div><div class="stat"><b>${mastered}</b><span>熟练条目</span></div><div class="stat"><b>${review}</b><span>待复习</span></div>`;$('overall').style.width=learned/DATA.length*100+'%';$('overallText').textContent=`总体进度 ${Math.round(learned/DATA.length*100)}% · 连续正确 3 次标为熟练`}
$('group').innerHTML='<option value="all">全部 513 条</option><option value="priority">考前重点专题</option>'+GROUPS.map(g=>`<option value="${g.id}">${String(g.id).padStart(2,'0')} · ${esc(g.name)}（${DATA.filter(c=>c.group===g.id).length}）</option>`).join('');function pool(){let g=$('group').value;return DATA.filter(c=>g==='all'||(g==='priority'?[1,2,3,4,5,9,11,12,13,14,15,16,17,18,21].includes(c.group):c.group==g))}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function groupNote(){let g=GROUPS.find(x=>x.id==$('group').value);$('groupnote').textContent=g?g.intro:'阅读先英译中；作文句式及搭配建议中译英。'}function begin(){let list=pool();if(tab==='review')list=list.filter(c=>reviewFilter==='due'?due(c):reviewFilter==='wrong'?status(c.id).wrong:reviewFilter==='star'?star(c):!status(c.id).seen);if(random)list=shuffle(list);let n=$('limit').value;queue=n==='all'?list:list.slice(0,+n);pos=0;session={right:0,total:0};reset();render()}function reset(){revealed=false;selected=null;options=[]}function chooseTab(t){tab=t;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));$('filters').hidden=t==='list';begin()}function mark(c,good){let s=status(c.id),level=good?Math.min(5,(s.level||0)+1):0;store[c.id]={...s,seen:true,level,wrong:good?(level<2&&!!s.wrong):true,due:Date.now()+(good?[0,1,3,7,14,30][level]*DAY:0),attempts:(s.attempts||0)+1};save();stats()}function toggleStar(id){store[id]={...status(id),star:!star({id})};save();render()}function next(){pos++;reset();render()}function prev(){if(pos>0){pos--;reset();render()}}function front(c){return $('direction').value==='en'?c.en:c.cn}function back(c){return $('direction').value==='en'?c.cn:c.en}function groupName(c){return GROUPS.find(g=>g.id===c.group).name}function starButton(c){return `<button class="star ${star(c)?'on':''}" data-star="${c.id}" aria-label="${star(c)?'取消收藏':'收藏'}">${star(c)?'★':'☆'}</button>`}function speak(c){if(!('speechSynthesis'in window)){alert('当前浏览器不支持朗读');return}let s=new SpeechSynthesisUtterance(c.en.replace(/^[\u4e00-\u9fff]+：/,''));s.lang='en-US';s.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(s)}function answer(c){return `<div class="answer"><b>${esc(back(c))}</b><div class="detail">${esc(c.detail)}</div></div>`}function makeOptions(c){let val=back(c),seen=new Set([val]),alts=[];for(let x of shuffle(DATA.filter(x=>x.group===c.group)).concat(shuffle(DATA))){let v=back(x);if(!seen.has(v)){seen.add(v);alts.push(v)}if(alts.length===3)break}return shuffle([val,...alts])}function render(){stats();groupNote();let root=$('body');if(tab==='list'){let filtered=pool().filter(c=>[c.en,c.cn,c.detail,groupName(c)].some(v=>v.toLowerCase().includes(search.toLowerCase())));root.innerHTML=`<section class="panel"><div class="filters"><div class="wide"><label>筛选专题</label><select id="listGroup">${$('group').innerHTML}</select></div><div class="wide"><label>搜索英文、中文、搭配</label><input class="search" id="search" placeholder="例如 attribute 或 归因" value="${esc(search)}"></div></div><p class="sub">共 ${filtered.length} 条</p><div id="entries">${filtered.map(c=>`<article class="entry"><div class="entryhead"><h3>${esc(c.en)}</h3>${starButton(c)}</div><div>${esc(c.cn)}</div><div class="detail">${esc(c.detail)}</div><small>${esc(groupName(c))}</small></article>`).join('')||'<p class="empty">没有匹配词汇</p>'}</div></section>`;$('listGroup').value=$('group').value;$('listGroup').onchange=e=>{$('group').value=e.target.value;render()};$('search').oninput=e=>{search=e.target.value;let start=e.target.selectionStart;render();$('search').focus();$('search').setSelectionRange(start,start)};return}let review=tab==='review'?`<section class="panel"><h2>复习范围</h2><div class="buttons">${[['due','到期复习'],['wrong','错词'],['star','收藏'],['new','未学习']].map(([v,t])=>`<button class="btn flex ${reviewFilter===v?'primary':''}" data-review="${v}">${t}</button>`).join('')}</div><p class="sub">答错立即进入复习，答对按 1 / 3 / 7 / 14 / 30 天安排重测。</p></section>`:'';if(!queue.length){root.innerHTML=review+'<section class="panel empty">当前范围没有可学习的条目。请换一个专题或复习范围。</section>';return}if(pos>=queue.length){root.innerHTML=review+`<section class="panel"><h2>本轮完成</h2><p>共 ${queue.length} 条，${session.total?'本轮测验答对 '+session.right+' / '+session.total+' 题':'已浏览本轮卡片'}。</p><p class="sub">到期或答错的条目可以在「复习错词」再次练习。</p><div class="buttons"><button class="btn primary flex" data-act="restart">再练一轮</button><button class="btn flex" data-act="review">去复习</button></div></section>`;return}let c=queue[pos],isQuiz=tab==='quiz';if(isQuiz&&!options.length)options=makeOptions(c);let controls=isQuiz?`<div>${options.map((v,i)=>`<button class="choice ${selected!==null&&v===back(c)?'correct':selected===i?'wrong':''}" data-choice="${i}" ${selected!==null?'disabled':''}>${'ABCD'[i]}. ${esc(v)}</button>`).join('')}</div>${selected!==null?`<p class="status">${options[selected]===back(c)?'回答正确':'正确答案已标出'}</p><div class="detail">${esc(c.detail)}</div><button class="btn primary" style="width:100%;margin-top:14px" data-act="next">下一题</button>`:''}`:`${revealed?answer(c):'<p class="sub">先在脑中回忆，再翻面核对。中译英允许同义表达，自行判断。</p>'}<div class="buttons" style="margin-top:14px">${revealed?'<button class="btn bad flex" data-act="bad">没记住</button><button class="btn primary flex" data-act="good">记住了</button>':'<button class="btn primary flex" data-act="flip">显示答案</button>'}</div>`;root.innerHTML=review+`<section class="panel"><div class="meta"><span>${esc(groupName(c))}</span>${starButton(c)}</div><div class="bar"><i style="width:${pos/queue.length*100}%"></i></div><div class="meta"><span>${pos+1} / ${queue.length}</span><span>${isQuiz?'选择正确答案':'回忆卡片'}</span></div><div class="question"><div class="word ${$('direction').value==='cn'?'cn':''}">${esc(front(c))}</div>${$('direction').value==='en'||revealed||selected!==null?'<div style="margin-top:12px"><button class="btn soft" data-act="speak">▷ 英文朗读</button></div>':''}</div>${controls}<div class="buttons" style="margin-top:12px"><button class="btn flex" data-act="prev" ${pos===0?'disabled':''}>上一条</button><button class="btn flex" data-act="next">跳过</button></div></section>`}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>chooseTab(b.dataset.tab));$('group').onchange=begin;$('direction').onchange=begin;$('limit').onchange=begin;$('start').onclick=begin;$('order').onclick=()=>{random=!random;$('order').textContent=random?'随机顺序':'原文顺序';begin()};$('body').addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.star){toggleStar(+b.dataset.star);return}if(b.dataset.review){reviewFilter=b.dataset.review;begin();return}let c=queue[pos];if(b.dataset.choice!==undefined&&selected===null&&c){selected=+b.dataset.choice;let good=options[selected]===back(c);session.total++;session.right+=good?1:0;mark(c,good);render();return}switch(b.dataset.act){case'flip':revealed=true;render();break;case'good':case'bad':if(c&&revealed){let good=b.dataset.act==='good';mark(c,good);next()}break;case'speak':if(c)speak(c);break;case'next':next();break;case'prev':prev();break;case'restart':begin();break;case'review':chooseTab('review');break}});begin();
</script></body></html>

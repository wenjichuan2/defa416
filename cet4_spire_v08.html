function cardArt(k){let c=info(k),fx=c.fx.map(f=>f.k),family=fx.some(x=>x.toLowerCase().includes('burn'))?'fire':fx.some(x=>['self','heal','turnheal','hurtstr','losthit','lowhit'].includes(x))?'blood':fx.some(x=>['block','retain','doubleblock','shieldhit','blockturn','blockhit','exblock','thorns'].includes(x))?'shield':fx.some(x=>['draw','energy','combo','exdraw','burnhand'].includes(x))?'rune':c.type==='power'?'crown':'blade';let pal={fire:['#ed9d4b','#6b272a'],blood:['#e0808b','#551f35'],shield:['#92c2d7','#263f60'],rune:['#b2a8ed','#45345e'],crown:['#f0d28b','#64472e'],blade:['#e0ba91','#653c40']}[family],seed=[...base(k)].reduce((n,v)=>n+v.charCodeAt(0),0),g='a'+base(k)+ (upgraded(k)?'u':'');let shapes={blade:`<g transform="rotate(${seed%21-10} 60 38)"><path d="M29 63L85 10 94 6 90 20 40 72Z" fill="#e4d9c4" stroke="#fff1cc" stroke-width="1"/><path d="M36 66L90 12" stroke="#77798a" stroke-width="2"/><path d="M25 51L49 75" stroke="${pal[0]}" stroke-width="5"/><path d="M32 65L19 78" stroke="#a36b53" stroke-width="5"/></g>`,shield:`<path d="M60 9L92 20 88 52Q80 66 60 77Q40 66 32 52L28 20Z" fill="#354c68" stroke="${pal[0]}" stroke-width="3"/><path d="M60 17L83 26 80 49Q73 61 60 68Q47 61 40 49L37 26Z" fill="#7d98af" stroke="#d3e4e6"/><path d="M60 23V61M43 40H77" stroke="#25344b" stroke-width="5"/>`,fire:`<path d="M62 5Q67 31 83 39Q95 53 81 68Q61 85 42 69Q24 57 42 35Q41 51 51 47Q68 30 62 5Z" fill="#dc6942" stroke="${pal[0]}" stroke-width="2"/><path d="M61 36Q75 52 70 65Q60 76 51 65Q44 56 61 36Z" fill="#ffda86"/>`,blood:`<path d="M60 10Q72 31 88 48Q100 71 75 78Q44 90 32 66Q22 50 60 10Z" fill="#a13e52" stroke="${pal[0]}" stroke-width="2"/><path d="M50 44Q40 61 49 69" fill="none" stroke="#ffc4b2" stroke-width="4" stroke-linecap="round"/>`,rune:`<g fill="none" stroke="${pal[0]}" stroke-width="2"><circle cx="60" cy="42" r="28"/><circle cx="60" cy="42" r="20"/><path d="M60 7L87 60H33Z M60 77L33 24H87Z"/></g><circle cx="60" cy="42" r="8" fill="#eee5ff"/>`,crown:`<path d="M30 function enhancedMonster(type){if(type==='knight')return heroArt().replaceAll('#ff9b58','#ff554d').replaceAll('#ab5846','#515067');let original=monsterArt(type);let palettes={slime:['#a1d69f','#38775d'],bat:['#a99acd','#3c294c'],skel:['#eee2bf','#746b64'],mush:['#e5a9b7','#6c374d'],eye:['#c5a2eb','#563b79'],golem:['#b3a89a','#51474e'],dragon:['#f5a17a','#763735']};let [light,dark]=palettes[type]||palettes.dragon;let extra=`<ellipse cx="60" cy="104" rx="49" ry="9" fill="#0d0c15" opacity=".7"/><g fill="${light}" opacity=".55"><circle cx="20" cy="32" r="1.5"/><circle cx="99" cy="24" r="2"/><circle cx="108" cy="77" r="1.2"/></g>`;return original.replace('xmlns="http://www.w3.org/2000/svg">','xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="m'+type+'" x2=".7" y2="1"><stop stop-color="'+light+'"/><stop offset="1" stop-color="'+dark+'"/></linearGradient></defs>'+extra).replace(/fill="(#[a-fA-F0-9]{6})"/g,(m,v)=>{return ['#76ab7d','#786ca1','#b9b9a1','#a55d70','#745a9a','#737b78','#a6574c'].includes(v)?'fill="url(#m'+type+')" stroke="'+dark+'" stroke-width="1.5"':m})}

function button(t,act,disabled=false,primary=false){return `<button class="wide ${primary?'primary':''}" onclick="${act}" ${disabled?'disabled':''}>${t}</button>`}
function deckChoices(act,filter=()=>true){return `<div class="hand">${s.deck.map((k,i)=>filter(k)?card(k,null,`${act}(${i})`):'').join('')}</div>`}
function mapView(){let icons={normal:'⚔',elite:'◆',rest:'♨',shop:'◇',event:'?',boss:'♛'},lines='',h='<div class="mapwrap"><svg viewBox="0 0 300 725" preserveAspectRatio="none" aria-hidden="true">';for(let r=0;r<10;r++)for(let c=0;c<3;c++)for(let d=0;d<3;d++){if(r===9&&d!==1||r<9&&Math.abs(c-d)>1)continue;let used=r+1<s.floor&&s.route[r]===c&&s.route[r+1]===d;lines+=`<line x1="${50+c*100}" y1="${697-r*66.5}" x2="${50+d*100}" y2="${697-(r+1)*66.5}" stroke="${used?'#e3ba72':'#776453'}" stroke-width="${used?2.5:1}" stroke-dasharray="${used?'0':'3 5'}" opacity="${used?1:.55}"/>`}h+=lines+'</svg><div class="mapgrid">';for(let r=10;r>=0;r--){for(let c=0;c<(r===10?1:3);c++){let col=r===10?1:c,k=s.map[r][col],on=r===s.floor&&avail(col),done=r<s.floor&&s.route[r]===col;h+=`<button class="${k} ${done?'selected':''} ${on?'available':''}" ${on?'':'disabled'} onclick="pickRoom(${col})"><span class="mapicon">${done?'✓':icons[k]}</span><span class="maplabel">${r+1} · ${roomNames[k].slice(2)}</span></button>`}}return h+'</div></div>'}

rade?deckChoices('upgrade',k=>!upgraded(k)):button(e[2],'eventChoice(0)',s.event===0&&s.hp<=10||s.event===3&&s.hp<=6||s.event===5&&s.gold<40||s.event===7&&(s.hp<=8||s.deck.every(upgraded))||s.event===8&&s.gold<30||s.event===11&&s.hp<=12,false)}${button(e[3],'eventChoice(1)',false,true)}</section>`}else if(s.phase==='battle'){let m=monsters[s.enemy],it=intent(),attack=Math.floor((it[1]+s.ePower)*(s.weak?.75:1));h+=`<section class="panel arena">${sceneArt()}<div class="intent">敌人意图：${it[0]==='攻'?'⚔ 攻击 '+attack:it[0]==='盾'?'⛨ 格挡 '+it[1]:it[0]==='强'?'力量 +'+it[1]:it[0]==='镜'?'镜面反制':it[0]==='诅'?'施加虚弱 '+it[1]:it[0]==='吸'?'汲血 '+(it[1]+s.ePower):'分裂准备'}</div><div class="stage"><div class="fighter">${heroArt()}<span class="figlabel">灰烬剑士</span></div><div class="foe">${enhancedMonster(m[1])}<span class="figlabel">${m[0]}</span></div></div><div class="enemyline"><span>${m[0]} ${s.eBlock?'⛨'+s.eBlock:''}</span><span>${Math.max(0,s.ehp)}/${s.emax}</span></div><div class="hp enemyhp"><i style="width:${clamp(100*s.ehp/s.emax,0,100)}%"></i></div><div class="small">${s.burn?'燃烧 '+s.burn+' · ':''}${s.vuln?'易伤 '+s.vuln+' · ':''}${s.weak?'虚弱 '+s.weak+' · ':''}${s.mirror?'镜面反伤':''}${s.split?'已分裂':''}${s.playerWeak?' · 自身虚弱 '+s.playerWeak:''}</div></section><div class="combatbar"><div class="orb">${s.energy}</div><div><b>⛨ ${s.block}　⚔ ${s.str+s.tempstr}</b><div class="small">护甲 · 力量</div></div><span class="small">第 ${s.turn} 回合${s.turn>=10?' · 狂暴':''}</span></div><div class="status"><span>抽牌 ${s.pile.length}</span><span>弃牌 ${s.discard.length}</span><span>消耗 ${s.ex.length}</span><span>连对 ${s.streak}</span></div><div class="log ${quiz?.done?(quiz.ok?'green':'red'):''}">${esc(msg)}</div>`;if(quiz){h+=`<section class="panel quizpanel"><div class="small">${info(quiz.key).name} · ${quiz.reverse?'选对应英文':'选择正确释义'}</div><div class="word">${esc(quiz.reverse?gloss(quiz.word.t):quiz.word.w)}</div><div class="small">${esc(quiz.reverse?'':quiz.word.p)}</div>${quiz.done?`<p class="${quiz.ok?'green':'re function coverage(){let total=words.length,active=words.filter(x=>progress[x.w]),tested=active.filter(x=>{let p=rec(x.w);return p.tested||p.right>0||p.wrong>0}),master=active.filter(x=>{let p=rec(x.w);return p.level>=5&&!p.known&&p.right>=5}),self=active.filter(x=>rec(x.w).known),skipped=words.filter(x=>!eligible(x)),unseen=total-active.length;return {total,active:active.length,tested:tested.length,master:master.length,self:self.length,skipped:skipped.length,unseen,eligible:total-skipped.length}}
function coveragePanel(){let c=coverage(),pct=n=>c.total?Math.round(n/c.total*1000)/10:0;return `<section class="panel"><h3>词塔档案 · 覆盖进度</h3><p class="small">当前词库 ${c.total} 条 / 来源目标 3815 条 · ${c.total===3815?'达到来源规模，非官方全量认证':'尚非完整来源词库'}</p><div class="studygrid"><div><b>${c.tested}</b><span>实际答题</span></div><div><b>${c.master}</b><span>验证熟练</span></div><div><b>${c.self}</b><span>自主标记</span></div></div><p>实际答题覆盖 ${pct(c.tested)}%</p><div class="hp"><i style="width:${pct(c.tested)}%"></i></div><p class="small">未接触 ${c.unseen} · 默认过滤 ${c.skipped}（未计入掌握） · 当前可考 ${c.eligible}。自主标记不等于答题验证；覆盖率分母为当前载入词库。</p></section>`}

if(s&&!s.act){s.act=1;if(!['battle','reward','victory','dead'].includes(s.phase)||s.floor<11)s.boss=actBoss(1);if(s.floor===11&&s.phase==='reward')s.phase='actClear';save()}
const preActRender=render;
render=function(){preActRender();document.body.dataset.act=String(s?.act||1);const top=document.querySelector('#app > .top');if(top){const note=document.createElement('div');note.className='offline-note';note.id='offline-status';note.textContent=offlineText();top.after(note);const b=document.createElement('button');b.className='wide';b.textContent='存档与离线';b.onclick=showOffline;note.after(b)}};

let offlineReady=false,offlineError=false,persistent=null,offlineNotice='';
function storageOK(){try{localStorage.setItem('spireStorageTest','1');const ok=localStorage.getItem('spireStorageTest')==='1';localStorage.removeItem('spireStorageTest');return ok}catch(e){return false}}

function embeddedFull(){try{return JSON.parse($('spire-embedded-bank').textContent)?.length===3815}catch(e){return false}}
function offlineText(){return (offlineReady?'✓ 游戏离线包已缓存':offlineError?'网页离线缓存不可用':'离线包未确认')+' · '+(embeddedFull()?'✓ 内嵌完整词库':bankCached()?'✓ 3815词已缓存':'词库 '+words.length+'/3815')}
function refreshOffline(){const e=$('offline-status');if(e)e.textContent=offlineText();const p=$('offline-detail');if(p)p.innerHTML=offlineDetails()}
async function checkOffline(){offlineReady=false;offlineError=false;try{if(!('serviceWorker' in navigator)||!window.isSecureContext||!('caches' in window))throw Error();const c=await caches.open('lexis-spire-v09');const key=new URL(location.pathname,location.origin).href;offlineReady=!!navigator.serviceWorker.controller&&!!(await c.match(key));}catch(e){offlineError=true}try{persistent=await navigator.storage?.persisted?.()??null}catch(e){persistent=null}refreshOffline()}
async function setupOffline(){try{if(location.protocol==='file:'||!('serviceWorker' in navigator)||!window.isSecureContext)throw Error();if(!location.pathname.endsWith('/cet4_spire_v08.html'))throw Error();const reg=await navigator.serviceWorker.register('./spire-sw.js',{updateViaCache:'none'});navigator.serviceWorker.addEventListener('controllerchange',checkOffline);await navigator.serviceWorker.ready;await checkOffline();reg.update().catch(()=>{});}catch(e){offlineError=true;refreshOffline()}}
function offlineDetails(){return `<p>${esc(offlineText())}</p><p>当前网络：${navigator.onLine?'在线（系统报告）':'离线（系统报告）'} · ${storageOK()?'本地存储可写':'本地存储不可写'}</p><p>持久存储：${persistent===true?'已获授权':persistent===false?'未获授权':'无法确认'}。</p><p>${offlineReady&&(bankCached()||embeddedFull())&&storageOK()?'离线条件已检查通过；请开启飞行模式、退出后重开验证。':'尚未确认全部离线条件。'}</p>`}
function showOffline(){studySession=null;$('app').innerHTML=`<button onclick="render()">← 返回远征</button><h2>存档与离线</h2><section class="panel"><h3>离线准备</h3><div id="offline-detail">${offlineDetails()}</div>${button('重新检测','checkOffline()')}${button('申请持久存储','requestPersistence()')}${button('联网同步完整词库','online()')}<p class="small">也可以从原始词库下载 JSON 后导入。</p><input type="file" accept=".json,application/json" onchange="importFile(this)"><p class="small">iPhone 主屏幕 App 和 Safari 可能各有独立存档；请先导出，再到另一处导入。</p></section><section class="panel"><h3>完整存档迁移</h3><p>包含当前远征（包括战斗与未完成的答题）、词库、学习记录、解锁、历史与设置。导入会替换当前进度，先备份当前设备。</p>${button('导出完整存档 JSON','exportFullSave()',false,true)}<label class="small">导入完整存档 / 旧版学习备份</label><input type="file" accept=".json,application/json" onchange="restoreFile(this)"><p id="save-notice" class="small">${esc(offlineNotice)}</p></section><section class="panel"><h3>独立离线文件</h3><p>将当前完整词库直接写进游戏 HTML 文件。此文件不含个人存档，另存 JSON 备份即可迁移进度。iPhone 文件预览不一定能执行游戏，主屏幕 PWA 是首选。</p>${button('导出内嵌完整词库的 HTML','exportPortable()',words.length!==3815,true)}</section>`;checkOffline()}
async function requestPersistence(){try{persistent=await navigator.storage?.persist?.()??null}catch(e){persistent=null}refreshOffline()}
function downloadData(data,name,type){const a=document.createElement('a');const url=URL.createObjectURL(new Blob([data],{type}));a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function fullSave(){return {format:'lexis-spire-save',version:1,gameVersion:'0.9',createdAt:new Date().toISOString(),progress,clock,study,meta,run:s,quiz,fxPrefs,words}}
function exportFullSave(){downloadData(JSON.stringify(fullSave()),'lexis-spire-save-'+new Date().toISOString().slice(0,10)+'.json','application/json');offlineNotice='已发起备份下载，请在文件 App 确认。';const e=$('save-notice');if(e)e.textContent=offlineNotice}
const isObj=x=>x!==null&&typeof x==='object'&&!Array.isArray(x);
const safeCard=k=>typeof k==='string'&&/^[a-z][a-z0-9_]*\+?$/.test(k)&&Object.hasOwn(cards,base(k));
function validateSave(d){if(!isObj(d)||!isObj(d.progress)||!Number.isFinite(d.clock)||d.clock<0)throw Error('不支持的存档格式');const legacy=d.format===undefined;if(!legacy&&(d.format!=='lexis-spire-save'||d.version!==1))throw Error('不支持的版本');if(Object.keys(d.progress).length>15000||Object.entries(d.progress).some(([w,p])=>['__proto__','constructor','prototype'].includes(w)||!isObj(p)))throw Error('学习记录损坏');if(d.study!==undefined&&!isObj(d.study)||d.meta!==undefined&&!isObj(d.meta))throw Error('设置损坏');if(!legacy){if(!Array.isArray(d.words)||d.words.length<100||d.words.length>15000||d.words.some(x=>!isObj(x)||typeof x.w!=='string'||typeof x.t!=='string'||['__proto__','constructor','prototype'].includes(x.w)))throw Error('词库损坏');const r=d.run;if(r!==null){if(!isObj(r)||!['map','battle','reward','rest','shop','event','actClear','dead','victory'].includes(r.phase)||![1,2,3].includes(r.act)||!Number.isInteger(r.floor)||r.floor<0||r.floor>11||!Array.isArray(r.map)||r.map.length!==11||r.map.some(row=>!Array.isArray(row)||row.length!==3||row.some(k=>!Object.hasOwn(roomNames,k)))||!Array.isArray(r.deck)||!r.deck.length||r.deck.some(k=>!safeCard(k))||!Array.isArray(r.route)||!Array.isArray(r.relic)||r.relic.some(k=>!Object.hasOwn(relics,k))||!Number.isInteger(r.boss)||!monsters[r.boss]||!Number.isFinite(r.hp)||!Number.isFinite(r.max)||r.max<=0||!Number.isFinite(r.gold))throw Error('远征记录损坏');for(const key of ['hand','pile','discard','ex','stock','reward'])if(r[key]!==undefined&&(!Array.isArray(r[key])||r[key].some(k=>!safeCard(k))))throw Error('牌组损坏');if(r.phase==='battle'&&(!monsters[r.enemy]||!Array.isArray(r.hand)||!Array.isArray(r.pile)||!Array.isArray(r.discard)||!Array.isArray(r.ex)))throw Error('战斗存档损坏');if(r.phase==='event'&&!events[r.event])throw Error('事件记录损坏');}if(d.quiz!==null&&(!isObj(d.quiz)||!r||r.phase!=='battle'||!isObj(d.quiz.word)||typeof d.quiz.word.w!=='string'||!Array.isArray(d.quiz.choices)||!safeCard(d.quiz.key)))throw Error('答题存档损坏');}return legacy}
function restoreBackup(d){const legacy=validateSave(d);const keys=['spireWords','spireClock',STUDYKEY,METAKEY,'spireRunV2','spireQuizV2',BANKKEY,'spireFxPrefs'];const before=keys.map(k=>localStorage.getItem(k));const mergedStudy={dailyNew:40,auto:true,...(d.study||{})};const mergedMeta={difficulty:'standard',loadout:'classic',runs:0,wins:0,best:0,bestCombo:0,history:[],finished:[],...(d.meta||{})};if(!Array.isArray(mergedMeta.history)||!Array.isArray(mergedMeta.finished))throw Error('历史记录损坏');const values=[JSON.stringify(d.progress),String(d.clock),JSON.stringify(mergedStudy),JSON.stringify(mergedMeta),JSON.stringify(legacy?s:d.run),JSON.stringify(legacy?quiz:d.quiz),JSON.stringify(legacy?words:d.words),JSON.stringify(legacy?fxPrefs:(d.fxPrefs||fxPrefs))];try{for(let i=0;i<keys.length;i++)localStorage.setItem(keys[i],values[i]);}catch(e){for(let i=0;i<keys.length;i++){try{if(before[i]===null)localStorage.removeItem(keys[i]);else localStorage.setItem(keys[i],before[i])}catch(_) {}}throw Error('本地存储空间不足或不可写；未确认恢复成功。')}location.reload()}
async function restoreFile(el){const f=el.files?.[0];if(!f)return;try{if(f.size>15000000)throw Error('存档文件过大');const d=JSON.parse(await f.text());const legacy=validateSave(d);if(!confirm(legacy?'导入旧版学习记录？会替换学习与局外进度，保留当前远征及词库。':'导入会覆盖当前远征、词汇与设置。确认已备份当前进度？'))return;restoreBackup(d)}catch(e){offlineNotice='导入失败：'+e.message;const n=$('save-notice');if(n)n.textContent=offlineNotice}finally{el.value=''}}
